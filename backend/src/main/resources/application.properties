spring.application.name=shopeasy

# MySQL Database Configuration

spring.datasource.url=jdbc:mysql://localhost:3306/shopeasy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=shopeasy_user
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Configuration

server.port=8080
